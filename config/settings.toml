# OpenClaw Agent Configuration
# Copy to config/settings.local.toml and fill in your values

[nvidia]
api_key = ""  # Your NVIDIA NIM API key
model = "meta/llama-3.1-70b-instruct"  # Model for job evaluation
base_url = "https://integrate.api.nvidia.com/v1"

[craigslist]
# Regions to search (craigslist subdomains)
regions = ["newyork", "sfbay", "losangeles", "chicago"]
# How often to scan (minutes)
scan_interval_minutes = 30
# Categories to search
categories = ["cpg", "acc", "ofc"]  # computer gigs, accounting, office/admin

[agent]
# Confidence threshold (0.0-1.0) above which agent auto-responds
auto_respond_threshold = 0.85
# Confidence threshold below which listings are ignored
ignore_threshold = 0.40
# Between ignore and auto-respond, agent notifies you
# Max auto-responses per day (safety limit)
max_auto_responses_per_day = 10

[notifications]
# Email notifications for borderline matches
smtp_host = ""
smtp_port = 587
smtp_user = ""
smtp_password = ""
notify_email = ""

[agent.capabilities]
# Services the agent advertises it can perform
services = [
    "data entry",
    "spreadsheet management",
    "bookkeeping",
    "accounts payable / receivable",
    "invoice processing",
    "PDF and document conversion",
    "database entry and cleanup",
    "email management and organization",
    "CRM data entry",
    "transcription",
    "web research and data collection",
    "inventory tracking",
    "payroll data entry",
    "tax document preparation",
    "receipt and expense categorization",
]
