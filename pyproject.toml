[project]
name = "openclaw-craigslist-agent"
version = "0.1.0"
description = "An autonomous agent that finds and responds to Craigslist jobs/gigs it can fulfill (data entry, accounting, etc.)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "openai>=1.40",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
openclaw = "openclaw.main:main"
openclaw-oauth = "openclaw.integrations.oauth_server:run_oauth_flow"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
